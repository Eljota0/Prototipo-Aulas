<!-- Se carga el sprite al abrir el formulario para tenerlo listo al registrarse. -->
<div class="registro-loader" [class.registro-loader--activo]="isLoading"
     [attr.aria-hidden]="!isLoading">
  <div class="registro-loader__martillo" aria-hidden="true">
    <img class="registro-loader__sprite" src="assets/images/crearcuenta/sprint-martillo.png"
         alt="" width="2816" height="476" loading="eager">
  </div>
  @if (isLoading) {
    <p class="registro-loader__texto" role="status" aria-live="polite">
      FORJANDO TU CUENTA<span class="puntos-animados" aria-hidden="true"></span>
    </p>
  }
</div>

<main class="forge-layout" [attr.inert]="isLoading ? '' : null" [attr.aria-busy]="isLoading">

    <!-- --- SISTEMA DE PARTÍCULAS (CENIZAS) --- -->
  <div class="ashes-container">
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    <div class="ash"></div><div class="ash"></div><div class="ash"></div>
    
  </div>
  
  <!-- Nuestro anfitrión (Z-Index Alto) -->
  <div class="draco-sprite" [class.draco-sprite--listo]="herreroSpriteListo"
       role="img" aria-label="Draco Herrero">
    <img class="draco-sprite__estatico"
         src="assets/images/draco/dracoanimaciones/dracoherrero/dracoherrero1.png"
         alt="" fetchpriority="high" width="2788" height="1536">
    <div class="draco-sprite__ventana" aria-hidden="true">
      <img #herreroSprite class="draco-sprite__hoja"
           src="assets/images/draco/dracoanimaciones/dracoherrero/sprint-dracoherrero.png"
           alt="" width="6902" height="1536" loading="eager" decoding="async"
           (load)="prepararSpriteHerrero(herreroSprite)"
           (error)="herreroSpriteListo = false">
    </div>
  </div>

  <!-- Contenedor Principal de la Tabla -->
  <section class="forge-table-wrapper">
    
    <!-- El Caldero Superior (Sobresale hacia arriba) -->
    <header class="table-cauldron">
      <h1 class="cauldron-text">Forjar nuevo usuario</h1>
    </header>

    <!-- CAPA 1: Borde Negro Exterior -->
    <div class="border-outer-black">
      
      <!-- CAPA 2: Río de Lava Animado -->
      <div class="border-middle-lava">
        
        <!-- CAPA 3: Borde Negro Interior -->
        <div class="border-inner-black">
          
          <!-- CAPA 4: El Lienzo de Ladrillos -->
          <form class="brick-content">
            
            <!-- Reemplaza el contenido vacío de tu form con esto -->
<div class="form-grid">
  
  <!-- Fila 1: Nombre y Apellido -->
  <div class="input-group">
    <label>Nombre</label>
    <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre..." required>
  </div>
  <div class="input-group">
    <label>Apellido</label>
    <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Tu apellido..." required>
  </div>

  <!-- Fila 2: Correo (Ocupa todo el ancho) -->
  <div class="input-group full-width">
    <label>Correo Electrónico</label>
    <input type="email" [(ngModel)]="email" name="email" placeholder="draco@dragoncode.com" required>
  </div>

  <!-- Fila 3: Contraseñas -->
  <div class="input-group">
    <label>Contraseña</label>
    <div class="input-wrapper">
      <input [type]="mostrarClave ? 'text' : 'password'" [(ngModel)]="password" (ngModelChange)="validarPassword($event)" name="password" placeholder="••••••••" required [ngClass]="{'input-error': errorRequisitos || errorCoincidencia}">
      <button type="button" class="btn-ver-clave" (click)="toggleClave()">
        <span class="material-symbols-outlined icono-toggle">{{ mostrarClave ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    <!-- Lista de Requisitos -->
    <ul class="password-requirements">
      <li [ngClass]="{'valido': requisitosClave.longitud}">Mínimo 6 caracteres</li>
      <li [ngClass]="{'valido': requisitosClave.mayuscula}">1 Mayúscula</li>
      <li [ngClass]="{'valido': requisitosClave.numero}">1 Número</li>
      <li [ngClass]="{'valido': requisitosClave.especial}">1 Especial</li>
    </ul>
  </div>
  <div class="input-group">
    <label>Confirmar Contraseña</label>
    <div class="input-wrapper">
      <input [type]="mostrarConfirmacion ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required [ngClass]="{'input-error': errorCoincidencia}">
      <button type="button" class="btn-ver-clave" (click)="toggleConfirmacion()">
        <span class="material-symbols-outlined icono-toggle">{{ mostrarConfirmacion ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
  </div>

  <!-- Fila 4: Términos y Condiciones -->
  <div class="checkbox-group full-width">
    <label class="custom-checkbox">
      <input type="checkbox" [(ngModel)]="aceptaTerminos" name="aceptaTerminos" [ngClass]="{'input-error': errorTerminos}">
      Acepto los términos y condiciones.
    </label>
  </div>

  <!-- Fila 5: El Botón de Acción -->
  <div class="action-group full-width">
    <a routerLink="/login" class="forge-btn forge-btn--back">VOLVER</a>
    <button type="button" (click)="forjarCuenta()" [disabled]="isLoading" class="forge-btn">
      {{ isLoading ? 'FORJANDO...' : 'FORJAR CUENTA' }}
    </button>
  </div>

</div>
            
          </form>

        </div>
      </div>
    </div>

  </section>

</main>
