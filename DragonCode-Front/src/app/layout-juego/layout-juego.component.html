<app-game-header
  [mostrarAyudaDraco]="modoJuego === 'aventura'"
  [mostrarAjustes]="mostrarAjustes"
  (salir)="abandonarPartida()"
  (onToggleDraco)="onToggleDraco.emit($event)">
</app-game-header>

<main class="game-layout-wrapper" [class.editor-activo]="modoEdicion">
  <div class="game-content-wrapper">
    <section class="game-board">
      <ng-content></ng-content>
    </section>

    <div class="mobile-divider" [attr.aria-hidden]="modoEdicion"></div>

    <aside class="game-controls" [attr.aria-hidden]="modoEdicion" [attr.inert]="modoEdicion ? '' : null">
      <app-consola-codigo 
        class="console-section"
        [lineas]="lineasCodigo" 
        [ejecutando]="ejecutando"
        [antiCopiaActivo]="antiCopiaActivo"
        [nivelActual]="nivelActual"
        [modoPlantilla]="modoPlantilla"
        [listoParaEjecutar]="listoParaEjecutar"
        (lineaBorrada)="eliminarLinea($event)"
        (onEjecutar)="ejecutarCodigo()"
        (onBorrarLinea)="borrarUltimaLinea()"
        (onDeshacerPaso)="onDeshacerPaso.emit($event)"
        (onLimpiar)="limpiarTodo()">
      </app-consola-codigo>

      <app-baraja-tarjetas 
        class="cards-section"
        [modoJuego]="modoJuego"
        [configuracion]="configuracionTarjetas" 
        [estadoObjetos]="estadoObjetos || {
          libro: { activo: true },
          clarividencia: { activo: true, consumida: false },
          vida: { activo: true, consumida: false },
          tiempo: { activo: true, consumida: false }
        }"
        (instruccionSeleccionada)="agregarCodigo($event)"
        (onUsarItem)="onUsarItem.emit($event)">
      </app-baraja-tarjetas>
    </aside>
  </div>
</main>
