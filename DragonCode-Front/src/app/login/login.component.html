<!-- El contenedor maestro con el fondo de la cueva -->
<div class="login-layout">
  <div class="runes-layer">
    @for (rune of runes; track $index) {
      <span class="rune"
            [style.top]="rune.top"
            [style.left]="rune.left"
            [style.color]="rune.color"
            [style.animation-delay]="rune.delay"
            [style.animation-duration]="rune.duration"
            [style.font-size]="rune.fontSize">
        {{ rune.symbol }}
      </span>
    }
  </div>

  <main class="main-content">
    <div class="login-wrapper">
      <section class="content-column">
        <div class="avatar-container">
          <div class="draco-avatar idle-animation"></div>
        </div>

        <div class="title-container">
          <img src="assets/images/login/titulo.png" alt="Dragon Code" class="game-title">
        </div>

        <div class="form-container">
          <form class="login-form">
            <h2 class="form-title">INICIAR SESIÓN</h2>

            <div class="input-group">
              <label for="email">Email</label>
              <input type="email" id="email" [(ngModel)]="email" name="email"
                     autocomplete="off" spellcheck="false"
                     placeholder="draco@dragoncode.com">
            </div>

            <div class="input-group">
              <label for="password">Contraseña</label>
              <div class="input-wrapper">
                <input [type]="mostrarClave ? 'text' : 'password'" id="password"
                       [(ngModel)]="password" name="password" placeholder="••••••••">
                <span class="material-symbols-outlined icono-toggle" (click)="toggleClave()">{{ mostrarClave ? 'visibility_off' : 'visibility' }}</span>
              </div>
            </div>

            <button type="button" (click)="iniciarSesion()" [disabled]="isLoading"
                    class="retro-btn primary-btn">
              {{ isLoading ? 'CARGANDO...' : 'INICIAR AVENTURA' }}
            </button>

            <button type="button" (click)="iniciarConGoogle()" class="retro-btn google-btn">
              INICIAR CON GOOGLE
            </button>

            <div class="form-actions">
              <a routerLink="/crear-cuenta" class="retro-link">Crear Cuenta</a>
              <a routerLink="/recuperar-cuenta" class="retro-link">Recuperar Cuenta</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
</div>
