<app-cyber-layout>

  <form class="cyber-form" (submit)="submitForm($event)">

    <!-- Encabezado -->
    <h2 class="cyber-title">NUEVA CONTRASEÑA</h2>
    <p class="cyber-text">
      Ingresa tu nueva contraseña para restaurar el acceso a tu cuenta.
    </p>

    <!-- Campo Nueva Contraseña -->
    <div class="cyber-input-group">
      <label for="nueva-password">Nueva Contraseña</label>
      <div class="cyber-input-wrapper">
        <input [type]="mostrarClave ? 'text' : 'password'" id="nueva-password" name="nuevaPassword"
               [(ngModel)]="nuevaPassword" placeholder="••••••••" required minlength="6">
        <button type="button" class="cyber-toggle-btn" (click)="toggleClave()">
          <span class="material-symbols-outlined">{{ mostrarClave ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <!-- Campo Confirmar Contraseña -->
    <div class="cyber-input-group">
      <label for="confirmar-password">Confirmar Contraseña</label>
      <div class="cyber-input-wrapper">
        <input [type]="mostrarConfirmacion ? 'text' : 'password'" id="confirmar-password" name="confirmarPassword"
               [(ngModel)]="confirmarPassword" placeholder="••••••••" required minlength="6">
        <button type="button" class="cyber-toggle-btn" (click)="toggleConfirmacion()">
          <span class="material-symbols-outlined">{{ mostrarConfirmacion ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <!-- Fila de acciones -->
    <div class="cyber-btn-row">
      <button type="submit" class="cyber-btn" [disabled]="isLoading">
        {{ isLoading ? 'GUARDANDO...' : 'GUARDAR CONTRASEÑA' }}
      </button>
      <a routerLink="/login" class="cyber-btn">VOLVER</a>
    </div>

  </form>

</app-cyber-layout>
